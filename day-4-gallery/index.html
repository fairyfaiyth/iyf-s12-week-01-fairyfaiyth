<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 4: Photo Gallery</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 16px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
figure { margin: 0; }
img { width: 100%; display: block; border-radius: 6px; }
figcaption { text-align: center; padding: 6px 0; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Photo Gallery</h1>
<div class="gallery">
<figure><img src="https://placehold.co/400x300?text=Photo+1" alt="Placeholder 1"><figcaption>Photo 1</figcaption></figure>
<figure><img src="https://placehold.co/400x300?text=Photo+2" alt="Placeholder 2"><figcaption>Photo 2</figcaption></figure>
<figure><img src="https://placehold.co/400x300?text=Photo+3" alt="Placeholder 3"><figcaption>Photo 3</figcaption></figure>
<figure><img src="https://placehold.co/400x300?text=Photo+4" alt="Placeholder 4"><figcaption>Photo 4</figcaption></figure>
<figure><img src="https://placehold.co/400x300?text=Photo+5" alt="Placeholder 5"><figcaption>Photo 5</figcaption></figure>
<figure><img src="https://placehold.co/400x300?text=Photo+6" alt="Placeholder 6"><figcaption>Photo 6</figcaption></figure>
</div>
</body>
</html>
